[build-system]
requires = [
    "setuptools>=75",
]
build-backend = "setuptools.build_meta"


[project]
name = "project-atlas"
version = "0.1.0"
description = "Offline AI knowledge platform with document retrieval and grounded local RAG."
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy==2.4.6",
    "ollama==0.6.2",
    "Pillow==12.3.0",
    "PyMuPDF==1.28.2",
    "pytesseract==0.3.13",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "sentence-transformers==5.7.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "streamlit==1.60.0",
]


[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "black==26.5.1",
    "ruff==0.16.1",
    "pre-commit==4.6.1",
]


[tool.setuptools]
packages = [
    "core",
    "config",
    "configs",
    "domain",
    "models",
    "plugins",
    "services",
    "infrastructure",
    "infrastructure.database",
    "infrastructure.database.repositories",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

addopts = "-ra"


[tool.black]
line-length = 79


[tool.ruff]
line-length = 79
target-version = "py311"